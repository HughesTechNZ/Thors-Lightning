plugins {
    id "com.android.application"
}

android {
    namespace "nz.co.thor.brightnesscontrol"
    compileSdk 35

    defaultConfig {
        applicationId "nz.co.thor.brightnesscontrol"
        minSdk 29
        targetSdk 35
        versionCode 10
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
