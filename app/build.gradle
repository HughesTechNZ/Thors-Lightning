plugins {
    id "com.android.application"
}

android {
    namespace "nz.co.thor.brightnesscontrol"
    compileSdk 35

    defaultConfig {
        applicationId "nz.co.thor.brightnesscontrol"
        minSdk 29
        targetSdk 35
        versionCode 14
        versionName "1.3.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
}
